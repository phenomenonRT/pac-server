name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-386
            goos: linux
            goarch: "386"
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: linux-armv5
            goos: linux
            goarch: arm
            goarm: "5"
          - name: linux-armv6
            goos: linux
            goarch: arm
            goarm: "6"
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
          - name: linux-mips-softfloat
            goos: linux
            goarch: mips
            gomips: softfloat
          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          rm -rf dist/package
          mkdir -p dist/package
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o dist/package/pac-server ./cmd/pac-server
          cp README.md install.sh uninstall.sh scripts/pac-server.service dist/package/
          tar -C dist/package -czf dist/pac-server-${{ matrix.name }}.tar.gz .
          sha256sum dist/pac-server-${{ matrix.name }}.tar.gz > dist/pac-server-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pac-server-${{ matrix.name }}
          path: |
            dist/pac-server-${{ matrix.name }}.tar.gz
            dist/pac-server-${{ matrix.name }}.tar.gz.sha256

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installer assets
        run: |
          mkdir -p dist
          cp install.sh dist/install.sh
          cp uninstall.sh dist/uninstall.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
