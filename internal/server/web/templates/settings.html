<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки PAC Server</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{ template "header" . }}

  <main class="page">
    <section class="child-window">
      <div class="panel-title">
        <h1>Настройки прослушивания</h1>
        <span>выбери сетевой интерфейс, чтобы не открыть интерфейс через WAN</span>
      </div>

      {{ template "alerts" . }}

      <form method="post" action="/settings" class="form-grid compact">
        <fieldset class="wide interface-list">
          <legend>Сетевые интерфейсы <b class="help" title="Список собран автоматически с этого устройства. Можно выбрать несколько — сервер откроет отдельный listener на каждом. 127.0.0.1 доступен только с этого устройства. Не выбирай 0.0.0.0, если не хочешь слушать все интерфейсы, включая WAN.">?</b></legend>
          {{ range .Interfaces }}
          <label class="checkbox-row">
            <input type="checkbox" name="listen_ip" value="{{ .IP }}" {{ if index $.SelectedListenIPs .IP }}checked{{ end }}>
            <span>{{ .Label }}</span>
          </label>
          {{ end }}
        </fieldset>
        <label>
          <span>Порт <b class="help" title="Порт веб-интерфейса и PAC-ссылок. Порт 81 на Linux/OpenWrt обычно требует запуск от root.">?</b></span>
          <input name="listen_port" type="number" min="1" max="65535" value="{{ .Config.ListenPort }}" required>
        </label>
        <div class="wide hint">
          Текущий адрес после перезапуска: <strong>{{ .Config.Address }}</strong>
        </div>
        <div class="wide form-footer">
          <button class="primary-button" type="submit">Сохранить настройки</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
