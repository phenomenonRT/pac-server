<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройки PAC Server</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{ template "header" . }}

  <main class="page">
    <section class="child-window">
      <div class="panel-title">
        <h1>Настройки прослушивания</h1>
        <span>выбери IP локальной сети, чтобы не открыть интерфейс через WAN</span>
      </div>

      {{ template "alerts" . }}

      <form method="post" action="/settings" class="form-grid compact">
        <label>
          <span>IP интерфейса <b class="help" title="127.0.0.1 доступен только с самого устройства. Для роутера обычно нужен LAN-IP, например 192.168.1.1. Не ставь 0.0.0.0, если не хочешь слушать все интерфейсы, включая WAN.">?</b></span>
          <input name="listen_ip" value="{{ .Config.ListenIP }}" placeholder="127.0.0.1" required>
        </label>
        <label>
          <span>Порт <b class="help" title="Порт веб-интерфейса и PAC-ссылок. Порт 81 на Linux/OpenWrt обычно требует запуск от root.">?</b></span>
          <input name="listen_port" type="number" min="1" max="65535" value="{{ .Config.ListenPort }}" required>
        </label>
        <div class="wide hint">
          Текущий адрес после перезапуска: <strong>{{ .Config.Address }}</strong>
        </div>
        <div class="wide form-footer">
          <button class="primary-button" type="submit">Сохранить настройки</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
